plugins {
    id "c"
    id "cpp"
    id "google-test-test-suite"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
}

// Define my targets (RoboRIO) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.frc.getTeamNumber()
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                frcCpp(getArtifactTypeClass('FRCNativeArtifact')) {
                }

                // Static files artifact
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/lvuser/deploy'
                    deleteOldFiles = true
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcCpp

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// Set to true to run simulation in debug mode
wpi.cpp.debugSimulation = false

// Default enable simgui
wpi.sim.addGui().defaultEnabled = true
// SimGUI polls joysticks on its render thread; avoid covered-window vsync
// throttling on Linux/Mesa. An explicit environment value remains an override.
if (System.getProperty("os.name").toLowerCase().contains("linux")) {
    wpi.sim.environment.put("vblank_mode", System.getenv("vblank_mode") ?: "0")
}
// Enable DS but not by default
wpi.sim.addDriverstation()

model {
    components {
        frcUserProgram(NativeExecutableSpec) {
            targetPlatform wpi.platforms.roborio
            if (includeDesktopSupport) {
                targetPlatform wpi.platforms.desktop
            }

            sources.cpp {
                source {
                    srcDir 'src/main/cpp'
                    include '**/*.cpp', '**/*.cc'
                }
                exportedHeaders {
                    srcDir 'src/main/include'
                    srcDir layout.buildDirectory.dir('jolt-headers').get().asFile
                }
            }

            sources.c {
                source {
                    srcDir 'src/main/c'
                    include '**/*.c'
                }
                exportedHeaders {
                    srcDir 'src/main/include'
                }
            }

            // Set deploy task to deploy this component
            deployArtifact.component = it

            // Enable run tasks for this component
            wpi.cpp.enableExternalTasks(it)

            // Enable simulation for this component
            wpi.sim.enable(it)
            // Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
            wpi.cpp.vendor.cpp(it)
            wpi.cpp.deps.wpilib(it)
        }
    }
    testSuites {
        frcUserProgramTest(GoogleTestTestSuiteSpec) {
            testing $.components.frcUserProgram

            sources.cpp {
                source {
                    srcDir 'src/test/cpp'
                    include '**/*.cpp'
                }
            }

            // Enable run tasks for this component
            wpi.cpp.enableExternalTasks(it)

            wpi.cpp.vendor.cpp(it)
            wpi.cpp.deps.wpilib(it)
            wpi.cpp.deps.googleTest(it)
        }
    }
}

// Gradle's native test runner forces its working directory to outputDir inside exec().
// Stage real deployed assets there so WPILib's desktop deploy path resolves normally.
tasks.withType(org.gradle.nativeplatform.test.tasks.RunTestExecutable).configureEach {
    inputs.dir('src/main/deploy')
    doFirst {
        project.copy {
            from('src/main/deploy')
            into(new File(outputDir, 'src/main/deploy'))
        }
    }
}

// Headers must match the Jolt objects already linked in MecoSimulation 2026.0.8.
// Only desktop compatibility sources include them; no roboRIO dependency is added.
def joltRevision = '0373ec0dd762e4bc2f6acdb08371ee84fa23c6db'
def joltHeaders = tasks.register('prepareJoltHeaders') {
    def destination = layout.buildDirectory.dir('jolt-headers')
    outputs.dir(destination)
    doLast {
        def archive = layout.buildDirectory.file('jolt-source.tar.gz').get().asFile
        if (!archive.exists()) {
            archive.parentFile.mkdirs()
            new URL("https://codeload.github.com/jrouwe/JoltPhysics/tar.gz/${joltRevision}").withInputStream { input ->
                archive.withOutputStream { output -> output << input }
            }
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        archive.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        if (digest.digest().encodeHex().toString() != '834644d7e9dffee9be0220748015667649d3361611b01c7e6839a5eb58e89711') {
            archive.delete()
            throw new GradleException('Pinned Jolt header archive SHA-256 mismatch')
        }
        copy {
            from tarTree(resources.gzip(archive))
            include '*/Jolt/**', '*/LICENSE'
            eachFile { path = path.substring(path.indexOf('/') + 1) }
            includeEmptyDirs = false
            into destination
        }
    }
}
tasks.configureEach {
    if (name.startsWith('compileFrcUserProgram')) {
        if (name.contains('Linuxathena')) mustRunAfter(joltHeaders)
        else dependsOn(joltHeaders)
    }
}

model {
    binaries {
        all { binary ->
            // The extended azimuth physics layout requires all direct owners,
            // including cached native-test objects, to rebuild together.
            binary.cppCompiler.define 'MECO_DRIVE_PHYSICS_LAYOUT', '2'
            // Native test source sets otherwise put vendordep headers first.
            if (binary.name.contains('Test')) binary.cppCompiler.args "-I${file('src/main/include').absolutePath}"
            // WPILib omits NDEBUG for optimized builds; Jolt's ABI uses it.
            if (binary.buildType.name == 'release') binary.cppCompiler.define 'MECO_JOLT_RELEASE'
        }
    }
}
